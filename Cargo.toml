[package]
name = "yewuse"
version = "0.1.0"
edition = "2021"
authors = ["YewUse Contributors"]
description = "A collection of essential utilities for Yew applications, inspired by VueUse"
repository = "https://github.com/username/yewuse"
license = "MIT"
keywords = ["yew", "hooks", "utilities", "wasm", "webassembly"]
categories = ["wasm", "web-programming"]
readme = "README.md"

[dependencies]
yew = "0.21.0"
web-sys = { version = "0.3.61", features = [
    "Window", 
    "Document", 
    "Element", 
    "HtmlElement", 
    "Node",
    "NodeList",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "InputEvent",
    "DomRect",
    "CssStyleDeclaration",
    "Storage",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlDocument",
    "MediaQueryList",
    "MediaQueryListEvent",
    "DeviceOrientationEvent",
    "IntersectionObserver",
    "IntersectionObserverInit",
    "IntersectionObserverEntry",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Navigator",
    "Clipboard",
    "Geolocation",
    "ScrollIntoViewOptions",
    "ScrollToOptions",
    "ScrollBehavior",
    "EventListenerOptions",
    "AddEventListenerOptions",
    "TouchEvent",
    "TouchList",
    "Touch",
    "HtmlLinkElement",
    "DomTokenList",
    "WebSocket",
    "MessageEvent",
    "Text"
]}
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.34"
js-sys = "0.3.61"
gloo = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
gloo-utils = "0.1.6"
mockall = "0.11.4"

[workspace]
members = [
    "examples/demo"
]
